apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.product.name | quote }}
    app.kubernetes.io/instance: {{ .Values.product.instance | quote }}
    app.kubernetes.io/version: {{ splitList "+" .Chart.Version | first | quote }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: {{ .Values.product.name | quote }}
spec:
  limits:
  - default:
      cpu: "1000m"
      memory: "512Mi"
      ephemeral-storage: "1Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
      ephemeral-storage: "100Mi"
    type: Container